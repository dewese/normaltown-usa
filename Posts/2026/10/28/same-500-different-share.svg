<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <text class="f-ink" x="600" y="220" text-anchor="middle" font-size="46" font-weight="800">The same $500</text>
  <circle class="s-ink" cx="360" cy="560" r="150" fill="none" stroke-width="6"/>
  <text class="f-ink" x="360" y="580.3" text-anchor="middle" font-size="58" font-weight="800">59%</text>
  <text class="f-ink" x="360" y="800" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.8">of an $850 bill</text>
  <circle class="f-ac" cx="840" cy="560" r="150"/>
  <text class="f-bg" x="840" y="580.3" text-anchor="middle" font-size="58" font-weight="800">2%</text>
  <text class="f-ink" x="840" y="800" text-anchor="middle" font-size="30" font-weight="700">of a $30,000 bill</text>
  <text class="f-ac" x="600" y="960" text-anchor="middle" font-size="32" font-weight="800">Built for the big ones.</text>
</svg>
