<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <text class="f-ink" x="600" y="220" text-anchor="middle" font-size="46" font-weight="800">After his heart stopped</text>
  <circle class="f-ac" cx="300" cy="540" r="90"/>
  <text class="f-bg" x="300" y="562" text-anchor="middle" font-size="64" font-weight="800">1</text>
  <text class="f-ink" x="300" y="700" text-anchor="middle" font-size="28" font-weight="700">care first</text>
  <circle class="s-ink" cx="600" cy="540" r="90" fill="none" stroke-width="7"/>
  <text class="f-ink" x="600" y="562" text-anchor="middle" font-size="64" font-weight="800">2</text>
  <text class="f-ink" x="600" y="700" text-anchor="middle" font-size="28" font-weight="700" fill-opacity="0.8">she called</text>
  <text class="f-ink" x="600" y="738" text-anchor="middle" font-size="28" font-weight="700" fill-opacity="0.8">the next day</text>
  <circle class="s-ink" cx="900" cy="540" r="90" fill="none" stroke-width="7"/>
  <text class="f-ink" x="900" y="562" text-anchor="middle" font-size="64" font-weight="800">3</text>
  <text class="f-ink" x="900" y="700" text-anchor="middle" font-size="28" font-weight="700" fill-opacity="0.8">bills negotiated</text>
  <text class="f-ink" x="900" y="738" text-anchor="middle" font-size="28" font-weight="700" fill-opacity="0.8">and funded</text>
  <g class="s-ac" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="405" y1="540" x2="492" y2="540"/><polyline points="466,520 496,540 466,560"/></g>
  <g class="s-ac" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="705" y1="540" x2="792" y2="540"/><polyline points="766,520 796,540 766,560"/></g>
  <text class="f-ac" x="600" y="930" text-anchor="middle" font-size="32" font-weight="800">Still in progress when she wrote.</text>
</svg>
