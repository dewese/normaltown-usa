<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <text class="f-ink" x="600" y="220" text-anchor="middle" font-size="46" font-weight="800">Same procedure. Three hospitals.</text>
  <text class="f-ink" x="200" y="344" text-anchor="start" font-size="28" font-weight="700" fill-opacity="0.8">Local hospital</text>
  <rect class="s-ink" x="200" y="360" width="700" height="46" rx="8" fill="none" stroke-width="5"/>
  <text class="f-ink" x="924" y="396" text-anchor="start" font-size="36" font-weight="800">$83,655</text>
  <text class="f-ink" x="200" y="494" text-anchor="start" font-size="28" font-weight="700" fill-opacity="0.8">90 miles away</text>
  <rect class="s-ink" x="200" y="510" width="371" height="46" rx="8" fill="none" stroke-width="5"/>
  <text class="f-ink" x="595" y="546" text-anchor="start" font-size="36" font-weight="800">$44,000</text>
  <text class="f-ink" x="200" y="644" text-anchor="start" font-size="28" font-weight="700">A few states away</text>
  <rect class="f-ac" x="200" y="660" width="182" height="46" rx="8"/>
  <text class="f-ac" x="406" y="696" text-anchor="start" font-size="36" font-weight="800">$22,000</text>
  <text class="f-ac" x="600" y="930" text-anchor="middle" font-size="32" font-weight="800">Funded by 150 members in 3 days.</text>
</svg>
