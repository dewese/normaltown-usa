<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="230" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">The easy part to pay for.</text>

  <!-- tooth -->
  <path d="M360 430 C 360 380, 480 380, 480 430 C 480 520, 460 620, 440 630 C 425 638, 425 560, 420 560 C 415 560, 415 638, 400 630 C 380 620, 360 520, 360 430 Z"
        fill="none" stroke="#2DD4FF" stroke-width="10" stroke-linejoin="round"/>
  <text x="420" y="720" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">dental</text>

  <!-- eye -->
  <path d="M720 520 Q800 450 880 520 Q800 590 720 520 Z" fill="none" stroke="#2DD4FF" stroke-width="10"/>
  <circle cx="800" cy="520" r="30" fill="none" stroke="#2DD4FF" stroke-width="10"/>
  <circle cx="800" cy="520" r="8" fill="#2DD4FF"/>
  <text x="800" y="720" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">vision</text>

  <text x="600" y="900" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF">Predictable. So budget it.</text>
</svg>
