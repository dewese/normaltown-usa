<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="220" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">One family. One year.</text>

  <!-- 12 month blocks, 4 x 3 -->
  <g>
    <!-- row 1 -->
    <rect x="270" y="330" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="430" y="330" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="590" y="330" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="750" y="330" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <!-- row 2 (one is the event) -->
    <rect x="270" y="450" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="430" y="450" width="140" height="100" rx="10" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <text x="500" y="512" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">$500</text>
    <rect x="590" y="450" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="750" y="450" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <!-- row 3 -->
    <rect x="270" y="570" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="430" y="570" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="590" y="570" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
    <rect x="750" y="570" width="140" height="100" rx="10" fill="#2DD4FF" fill-opacity="0.85"/>
  </g>

  <text x="600" y="800" text-anchor="middle" font-size="34" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">flat fees + one $500 event</text>
  <text x="600" y="900" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF">~$5,500 for the year</text>
  <text x="600" y="970" text-anchor="middle" font-size="30" font-weight="700" fill="#2DD4FF">broken arm included</text>
</svg>
