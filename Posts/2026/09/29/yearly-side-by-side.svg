<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="170" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">One year, all in.</text>

  <line x1="180" y1="900" x2="1020" y2="900" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.25"/>

  <!-- traditional plan bar (tall/faint) -->
  <rect x="270" y="300" width="240" height="600" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6"/>
  <text x="390" y="265" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF" fill-opacity="0.7">~$20,000</text>
  <text x="390" y="960" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF" fill-opacity="0.7">traditional plan</text>

  <!-- health sharing bar (short/cyan) -->
  <rect x="690" y="740" width="240" height="160" fill="#2DD4FF"/>
  <text x="810" y="705" text-anchor="middle" font-size="42" font-weight="800" fill="#2DD4FF">~$5,500</text>
  <text x="810" y="960" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">health sharing</text>

  <text x="600" y="1070" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF" fill-opacity="0.6">Healthy family, event included.</text>
</svg>
