<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <!-- baseline -->
  <line x1="200" y1="860" x2="1000" y2="860" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.25"/>

  <!-- small $500 block -->
  <rect x="290" y="790" width="220" height="70" fill="#2DD4FF"/>
  <text x="400" y="750" text-anchor="middle" font-size="52" font-weight="800" fill="#2DD4FF">$500</text>
  <text x="400" y="920" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">per event</text>

  <!-- tall deductible bar -->
  <rect x="690" y="300" width="220" height="560" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.7"/>
  <text x="800" y="260" text-anchor="middle" font-size="52" font-weight="800" fill="#FFFFFF">$8,000</text>
  <text x="800" y="920" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF" fill-opacity="0.7">deductible, every year</text>

  <text x="600" y="1050" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">A step, not a wall.</text>
</svg>
