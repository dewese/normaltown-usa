<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="180" text-anchor="middle" font-size="42" font-weight="800">The numbers, no pitch.</text>

  <text class="f-ac" x="600" y="380" text-anchor="middle" font-size="110" font-weight="800">45,000+</text>
  <text class="f-ink" x="600" y="435" text-anchor="middle" font-size="32" font-weight="600" fill-opacity="0.7">bills funded</text>

  <text class="f-ink" x="600" y="620" text-anchor="middle" font-size="110" font-weight="800">$600k+</text>
  <text class="f-ink" x="600" y="675" text-anchor="middle" font-size="32" font-weight="600" fill-opacity="0.7">largest single bill shared</text>

  <text class="f-ac" x="600" y="860" text-anchor="middle" font-size="110" font-weight="800">~1 week</text>
  <text class="f-ink" x="600" y="915" text-anchor="middle" font-size="32" font-weight="600" fill-opacity="0.7">to fund a complete submission</text>

  <text class="f-ink" x="600" y="1060" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.5">Strong history. Not a legal guarantee.</text>
</svg>
