<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="200" text-anchor="middle" font-size="46" font-weight="800" fill="#FFFFFF">Layers, not one magic plan.</text>

  <!-- three stacked bands -->
  <rect x="300" y="330" width="600" height="150" rx="14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6"/>
  <text x="600" y="425" text-anchor="middle" font-size="38" font-weight="800" fill="#FFFFFF" fill-opacity="0.85">1. Emergency fund</text>

  <rect x="300" y="510" width="600" height="150" rx="14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.6"/>
  <text x="600" y="605" text-anchor="middle" font-size="38" font-weight="800" fill="#FFFFFF" fill-opacity="0.85">2. Know the cash price</text>

  <rect x="300" y="690" width="600" height="150" rx="14" fill="#2DD4FF"/>
  <text x="600" y="785" text-anchor="middle" font-size="38" font-weight="800" fill="#0F0F0F">3. Cover the big stuff</text>

  <text x="600" y="960" text-anchor="middle" font-size="34" font-weight="600" fill="#FFFFFF" fill-opacity="0.6">One weak spot won't sink you.</text>
</svg>
