<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="240" text-anchor="middle" font-size="46" font-weight="800" fill="#FFFFFF">Five honest questions.</text>

  <!-- five numbered circles, staggered down like steps -->
  <g>
    <circle cx="250" cy="430" r="70" fill="#2DD4FF"/><text x="250" y="455" text-anchor="middle" font-size="52" font-weight="800" fill="#0F0F0F">1</text>
    <circle cx="425" cy="500" r="70" fill="#2DD4FF" fill-opacity="0.9"/><text x="425" y="525" text-anchor="middle" font-size="52" font-weight="800" fill="#0F0F0F">2</text>
    <circle cx="600" cy="570" r="70" fill="#2DD4FF" fill-opacity="0.8"/><text x="600" y="595" text-anchor="middle" font-size="52" font-weight="800" fill="#0F0F0F">3</text>
    <circle cx="775" cy="640" r="70" fill="#2DD4FF" fill-opacity="0.7"/><text x="775" y="665" text-anchor="middle" font-size="52" font-weight="800" fill="#0F0F0F">4</text>
    <circle cx="950" cy="710" r="70" fill="#2DD4FF" fill-opacity="0.6"/><text x="950" y="735" text-anchor="middle" font-size="52" font-weight="800" fill="#0F0F0F">5</text>
  </g>

  <text x="600" y="900" text-anchor="middle" font-size="40" font-weight="800" fill="#FFFFFF">Mostly yes? Take a look.</text>
  <text x="600" y="970" text-anchor="middle" font-size="30" font-weight="600" fill="#FFFFFF" fill-opacity="0.6">Decide with your eyes open.</text>
</svg>
