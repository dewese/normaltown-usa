<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="200" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">A little each month.</text>

  <!-- coins falling in -->
  <g fill="#2DD4FF">
    <circle cx="470" cy="300" r="26"/>
    <circle cx="600" cy="250" r="26" fill-opacity="0.8"/>
    <circle cx="730" cy="300" r="26" fill-opacity="0.6"/>
  </g>

  <!-- jar -->
  <path d="M400 430 L400 820 Q400 880 460 880 L740 880 Q800 880 800 820 L800 430"
        fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <rect x="380" y="400" width="440" height="40" rx="10" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <!-- fill level -->
  <path d="M410 640 L410 820 Q410 870 460 870 L740 870 Q790 870 790 820 L790 640 Z" fill="#2DD4FF" fill-opacity="0.85"/>
  <text x="600" y="770" text-anchor="middle" font-size="40" font-weight="800" fill="#0F0F0F">$500 +</text>

  <text x="600" y="990" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF" fill-opacity="0.7">Surprise bills become planned ones.</text>
</svg>
