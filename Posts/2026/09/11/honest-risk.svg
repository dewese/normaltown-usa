<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <!-- falling bill -->
  <rect x="520" y="200" width="160" height="200" rx="10" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.7"/>
  <text x="600" y="320" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF" fill-opacity="0.7">BILL</text>

  <!-- net: cyan mesh with a gap on the right -->
  <g stroke="#2DD4FF" stroke-width="6" fill="none">
    <path d="M180 640 Q600 820 940 660"/>
    <line x1="240" y1="662" x2="300" y2="760"/>
    <line x1="330" y1="690" x2="390" y2="800"/>
    <line x1="430" y1="712" x2="490" y2="822"/>
    <line x1="540" y1="726" x2="600" y2="828"/>
    <line x1="650" y1="722" x2="700" y2="820"/>
    <line x1="760" y1="706" x2="800" y2="795"/>
    <path d="M240 760 Q600 900 800 796" />
    <path d="M300 700 Q600 850 860 700" stroke-opacity="0.6"/>
  </g>
  <!-- honest gap marker -->
  <text x="990" y="660" font-size="26" font-weight="600" fill="#FFFFFF" fill-opacity="0.45">no legal</text>
  <text x="990" y="694" font-size="26" font-weight="600" fill="#FFFFFF" fill-opacity="0.45">guarantee</text>

  <text x="600" y="1010" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">Strong net. Honest gap.</text>
</svg>
