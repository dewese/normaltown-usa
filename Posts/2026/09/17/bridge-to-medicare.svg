<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="230" text-anchor="middle" font-size="44" font-weight="800" fill="#FFFFFF">Bridging the gap to 65.</text>

  <!-- two posts -->
  <line x1="230" y1="560" x2="230" y2="820" stroke="#FFFFFF" stroke-width="10" stroke-opacity="0.6"/>
  <line x1="970" y1="560" x2="970" y2="820" stroke="#FFFFFF" stroke-width="10" stroke-opacity="0.6"/>

  <!-- bridge span (cyan) -->
  <path d="M230 560 Q600 430 970 560" fill="none" stroke="#2DD4FF" stroke-width="14" stroke-linecap="round"/>
  <!-- suspenders -->
  <g stroke="#2DD4FF" stroke-width="5" stroke-opacity="0.7">
    <line x1="360" y1="512" x2="360" y2="560"/>
    <line x1="490" y1="478" x2="490" y2="560"/>
    <line x1="600" y1="466" x2="600" y2="560"/>
    <line x1="710" y1="478" x2="710" y2="560"/>
    <line x1="840" y1="512" x2="840" y2="560"/>
  </g>

  <text x="230" y="880" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF" fill-opacity="0.75">retire at 60</text>
  <text x="970" y="880" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF" fill-opacity="0.75">Medicare at 65</text>

  <text x="600" y="1000" text-anchor="middle" font-size="36" font-weight="800" fill="#2DD4FF">Flat price, whatever your age.</text>
</svg>
