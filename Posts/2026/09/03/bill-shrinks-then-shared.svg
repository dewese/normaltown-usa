<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>
  <line x1="150" y1="820" x2="1050" y2="820" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 1: list price, tall white -->
  <rect x="210" y="230" width="150" height="590" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <text x="285" y="880" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">LIST</text>
  <text x="285" y="914" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">PRICE</text>

  <!-- arrow down -->
  <g stroke="#2DD4FF" stroke-width="5" fill="#2DD4FF">
    <line x1="440" y1="520" x2="560" y2="520"/>
    <polygon points="560,500 600,520 560,540"/>
  </g>
  <text x="520" y="480" text-anchor="middle" font-size="24" font-weight="700" fill="#2DD4FF">negotiated</text>

  <!-- 2: negotiated, short white -->
  <rect x="640" y="620" width="150" height="200" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <text x="715" y="880" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">NEGOTIATED</text>

  <!-- arrow to crowd -->
  <g stroke="#2DD4FF" stroke-width="5" fill="#2DD4FF">
    <line x1="820" y1="720" x2="880" y2="720"/>
    <polygon points="880,700 920,720 880,740"/>
  </g>

  <!-- 3: the crowd, small cyan segments -->
  <g fill="#2DD4FF">
    <rect x="945" y="740" width="80" height="22" rx="4"/>
    <rect x="945" y="768" width="80" height="22" rx="4"/>
    <rect x="945" y="796" width="80" height="22" rx="4"/>
    <rect x="945" y="712" width="80" height="22" rx="4"/>
    <rect x="945" y="684" width="80" height="22" rx="4"/>
  </g>
  <text x="985" y="880" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">THE CROWD</text>

  <text x="600" y="990" text-anchor="middle" font-size="27" font-weight="500" fill="#FFFFFF" fill-opacity="0.6">shrink the bill first, then share what's left</text>
</svg>
