<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>

  <text x="600" y="210" text-anchor="middle" font-size="46" font-weight="800" fill="#FFFFFF">Switch on answers.</text>

  <!-- 4 checklist rows -->
  <g>
    <rect x="330" y="330" width="70" height="70" rx="12" fill="none" stroke="#2DD4FF" stroke-width="6"/>
    <polyline points="345,368 368,390 405,345" fill="none" stroke="#2DD4FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="385" font-size="36" font-weight="700" fill="#FFFFFF">Are we healthy?</text>

    <rect x="330" y="450" width="70" height="70" rx="12" fill="none" stroke="#2DD4FF" stroke-width="6"/>
    <polyline points="345,488 368,510 405,465" fill="none" stroke="#2DD4FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="505" font-size="36" font-weight="700" fill="#FFFFFF">$500 always on hand?</text>

    <rect x="330" y="570" width="70" height="70" rx="12" fill="none" stroke="#2DD4FF" stroke-width="6"/>
    <polyline points="345,608 368,630 405,585" fill="none" stroke="#2DD4FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="625" font-size="36" font-weight="700" fill="#FFFFFF">Read the guidelines?</text>

    <rect x="330" y="690" width="70" height="70" rx="12" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.5"/>
    <text x="440" y="745" font-size="36" font-weight="700" fill="#FFFFFF" fill-opacity="0.7">Okay with no guarantee?</text>
  </g>

  <text x="600" y="920" text-anchor="middle" font-size="34" font-weight="800" fill="#2DD4FF">Answer honestly. Then decide.</text>
</svg>
