<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
<rect class="f-bg" width="1200" height="1200"/>
<rect class="f-ink" x="150" y="860" width="170" height="140" fill-opacity="0.18"/>
<text class="f-ink" x="235" y="836" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">REST AT HOME</text>
<rect class="f-ac" x="330" y="740" width="170" height="260"/>
<text class="f-ac" x="415" y="716" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">VIDEO VISIT</text>
<rect class="f-ink" x="510" y="620" width="170" height="380" fill-opacity="0.18"/>
<text class="f-ink" x="595" y="596" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">URGENT CARE</text>
<rect class="f-ink" x="690" y="500" width="170" height="500" fill-opacity="0.18"/>
<text class="f-ink" x="775" y="476" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">PRESCRIPTION</text>
<rect class="f-ink" x="870" y="380" width="170" height="620" fill-opacity="0.18"/>
<text class="f-ink" x="955" y="356" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">THE ER</text>
<text class="f-ink" x="150" y="250" font-size="44" font-weight="800" text-anchor="start">Match the care</text>
<text class="f-ac" x="150" y="310" font-size="44" font-weight="800" text-anchor="start">to the size of the problem.</text>
</svg>
