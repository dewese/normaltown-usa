<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E7490}.s-ac{stroke:#0E7490}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#2DD4FF}.s-ac{stroke:#2DD4FF}}</style>
<rect class="f-bg" width="1200" height="1200"/>
<line class="s-ink" x1="160" y1="600" x2="520" y2="600" stroke-width="6" stroke-linecap="round"/>
<line class="s-ac" x1="520" y1="600" x2="1030" y2="600" stroke-width="10" stroke-linecap="round"/>
<path class="s-ac" d="M1000 570 L1035 600 L1000 630" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
