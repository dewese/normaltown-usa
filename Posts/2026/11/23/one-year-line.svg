<text class="f-ink" x="520" y="700" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1" text-anchor="middle">1 YEAR</text>
<text class="f-ink" x="340" y="530" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill-opacity="0.6" letter-spacing="1" text-anchor="middle">SHORT TERM</text>
<text class="f-ac" x="775" y="530" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1" text-anchor="middle">LONG TERM</text>
</svg>
