<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
<rect class="f-bg" width="1200" height="1200"/>
<line class="s-ink" x1="150" y1="600" x2="1050" y2="600" stroke-width="4" stroke-opacity="0.35"/>
<rect class="f-ac" x="770" y="560" width="210" height="80"/>
<line class="s-ink" x1="770" y1="520" x2="770" y2="680" stroke-width="4"/>
<line class="s-ink" x1="890" y1="530" x2="890" y2="670" stroke-width="3" stroke-dasharray="8 8"/>
<line class="s-ink" x1="980" y1="520" x2="980" y2="680" stroke-width="4"/>
<text class="f-ink" x="770" y="490" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="2">NOV 1</text>
<text class="f-ink" x="890" y="740" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="2" fill-opacity="0.8">DEC 15</text>
<text class="f-ink" x="980" y="490" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="2">JAN 15</text>
<text class="f-ink" x="150" y="660" font-size="24" font-weight="700" letter-spacing="2" fill-opacity="0.6">THE REST OF THE YEAR</text>
<text class="f-ac" x="600" y="900" font-size="40" font-weight="800" text-anchor="middle">The door opens once a year.</text>
</svg>
