<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0F0F0F"/>
  <text x="600" y="220" text-anchor="middle" font-size="46" font-weight="800" fill="#FFFFFF">Gallbladder, planned</text>
  <line x1="220" y1="560" x2="980" y2="560" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="220" cy="560" r="24" fill="#0F0F0F" stroke="#FFFFFF" stroke-width="6"/>
  <text x="220" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">ER</text>
  <text x="220" y="640" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">diagnosis</text>
  <circle cx="473" cy="560" r="24" fill="#0F0F0F" stroke="#FFFFFF" stroke-width="6"/>
  <text x="473" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">price</text>
  <text x="473" y="640" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">surgeon</text>
  <text x="473" y="676" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">chosen</text>
  <circle cx="727" cy="560" r="30" fill="#2DD4FF"/>
  <text x="727" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#2DD4FF">funded</text>
  <text x="727" y="640" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">by the crowd</text>
  <circle cx="980" cy="560" r="24" fill="#0F0F0F" stroke="#FFFFFF" stroke-width="6"/>
  <text x="980" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">surgery</text>
  <text x="980" y="640" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF" fill-opacity="0.8">after the money</text>
  <text x="600" y="900" text-anchor="middle" font-size="32" font-weight="800" fill="#2DD4FF">Money first. Then the operation.</text>
