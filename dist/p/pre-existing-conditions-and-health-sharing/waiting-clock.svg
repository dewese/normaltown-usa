<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- clock circle -->
  <circle class="s-ink" cx="600" cy="540" r="260" fill="none" stroke-width="6" stroke-opacity="0.5"/>
  <!-- faint arc (not yet) -->
  <path class="s-ink" d="M600 280 A260 260 0 0 0 340 540" fill="none" stroke-width="18" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- bright cyan arc (becomes eligible) -->
  <path class="s-ac" d="M600 280 A260 260 0 0 1 860 540" fill="none" stroke-width="18" stroke-linecap="round"/>

  <!-- hand -->
  <line class="s-ac" x1="600" y1="540" x2="770" y2="440" stroke-width="12" stroke-linecap="round"/>
  <circle class="f-ac" cx="600" cy="540" r="16"/>

  <text class="f-ink" x="360" y="900" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.5">not yet eligible</text>
  <text class="f-ac" x="840" y="900" text-anchor="middle" font-size="30" font-weight="800">may be shared</text>

  <text class="f-ink" x="600" y="1030" text-anchor="middle" font-size="40" font-weight="800">Time healthy earns eligibility.</text>
</svg>
