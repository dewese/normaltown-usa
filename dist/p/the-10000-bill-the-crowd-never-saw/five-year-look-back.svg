<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <text class="f-ink" x="600" y="220" text-anchor="middle" font-size="46" font-weight="800">The pre-existing rule</text>
  <line class="s-ink" x1="220" y1="560" x2="980" y2="560" stroke-width="5"/>
  <circle class="f-bg s-ink" cx="220" cy="560" r="24" stroke-width="6"/>
  <text class="f-ink" x="220" y="500" text-anchor="middle" font-size="34" font-weight="800">5 years</text>
  <text class="f-ink" x="220" y="640" text-anchor="middle" font-size="26" font-weight="700" fill-opacity="0.8">look-back</text>
  <text class="f-ink" x="220" y="676" text-anchor="middle" font-size="26" font-weight="700" fill-opacity="0.8">before joining</text>
  <circle class="f-ac" cx="600" cy="560" r="30"/>
  <text class="f-ac" x="600" y="500" text-anchor="middle" font-size="34" font-weight="800">years 1-2</text>
  <text class="f-ink" x="600" y="640" text-anchor="middle" font-size="26" font-weight="700">not shared</text>
  <circle class="f-bg s-ink" cx="980" cy="560" r="24" stroke-width="6"/>
  <text class="f-ink" x="980" y="500" text-anchor="middle" font-size="34" font-weight="800">year 3+</text>
  <text class="f-ink" x="980" y="640" text-anchor="middle" font-size="26" font-weight="700" fill-opacity="0.8">up to $25,000</text>
  <text class="f-ink" x="980" y="676" text-anchor="middle" font-size="26" font-weight="700" fill-opacity="0.8">a year</text>
  <text class="f-ac" x="600" y="900" text-anchor="middle" font-size="32" font-weight="800">Symptoms count, not just a diagnosis.</text>
</svg>
