<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <text class="f-ink" x="600" y="220" text-anchor="middle" font-size="46" font-weight="800">Your homework</text>
  <circle class="f-ac" cx="290" cy="360" r="24"/>
  <text class="f-ink" x="350" y="372" text-anchor="start" font-size="34" font-weight="700">ask for the cash price</text>
  <circle class="f-ac" cx="290" cy="465" r="24"/>
  <text class="f-ink" x="350" y="477" text-anchor="start" font-size="34" font-weight="700">get an itemized bill</text>
  <circle class="f-ac" cx="290" cy="570" r="24"/>
  <text class="f-ink" x="350" y="582" text-anchor="start" font-size="34" font-weight="700">pay, or set up a plan</text>
  <circle class="f-ac" cx="290" cy="675" r="24"/>
  <text class="f-ink" x="350" y="687" text-anchor="start" font-size="34" font-weight="700">upload it within 6 months</text>
  <circle class="f-ac" cx="290" cy="780" r="24"/>
  <text class="f-ink" x="350" y="792" text-anchor="start" font-size="34" font-weight="700">wait to be paid back</text>
  <text class="f-ac" x="600" y="950" text-anchor="middle" font-size="32" font-weight="800">The savings come with a to-do list.</text>
</svg>
