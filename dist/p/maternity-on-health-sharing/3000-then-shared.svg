<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="230" text-anchor="middle" font-size="44" font-weight="800">The whole delivery, one event.</text>

  <!-- a single wide bar split: small cyan (your part) + large white (crowd) -->
  <rect class="f-ac" x="200" y="470" width="200" height="180"/>
  <rect class="s-ink" x="400" y="470" width="600" height="180" fill="none" stroke-width="6" stroke-opacity="0.7"/>

  <text class="f-ac" x="300" y="420" text-anchor="middle" font-size="40" font-weight="800">$3,000</text>
  <text class="f-ink" x="300" y="720" text-anchor="middle" font-size="28" font-weight="700">your part</text>

  <text class="f-ink" x="700" y="420" text-anchor="middle" font-size="40" font-weight="800" fill-opacity="0.8">the rest</text>
  <text class="f-ink" x="700" y="720" text-anchor="middle" font-size="28" font-weight="700" fill-opacity="0.7">the crowd shares</text>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="34" font-weight="700" fill-opacity="0.6">Just join before you're expecting.</text>
</svg>
