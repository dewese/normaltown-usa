<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="210" text-anchor="middle" font-size="46" font-weight="800">Switch on answers.</text>

  <!-- 4 checklist rows -->
  <g>
    <rect class="s-ac" x="330" y="330" width="70" height="70" rx="12" fill="none" stroke-width="6"/>
    <polyline class="s-ac" points="345,368 368,390 405,345" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="f-ink" x="440" y="385" font-size="36" font-weight="700">Are we healthy?</text>

    <rect class="s-ac" x="330" y="450" width="70" height="70" rx="12" fill="none" stroke-width="6"/>
    <polyline class="s-ac" points="345,488 368,510 405,465" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="f-ink" x="440" y="505" font-size="36" font-weight="700">$500 always on hand?</text>

    <rect class="s-ac" x="330" y="570" width="70" height="70" rx="12" fill="none" stroke-width="6"/>
    <polyline class="s-ac" points="345,608 368,630 405,585" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="f-ink" x="440" y="625" font-size="36" font-weight="700">Read the guidelines?</text>

    <rect class="s-ink" x="330" y="690" width="70" height="70" rx="12" fill="none" stroke-width="6" stroke-opacity="0.5"/>
    <text class="f-ink" x="440" y="745" font-size="36" font-weight="700" fill-opacity="0.7">Okay with no guarantee?</text>
  </g>

  <text class="f-ac" x="600" y="920" text-anchor="middle" font-size="34" font-weight="800">Answer honestly. Then decide.</text>
</svg>
