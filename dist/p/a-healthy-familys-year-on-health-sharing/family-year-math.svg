<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="220" text-anchor="middle" font-size="44" font-weight="800">One family. One year.</text>

  <!-- 12 month blocks, 4 x 3 -->
  <g>
    <!-- row 1 -->
    <rect class="f-ac" x="270" y="330" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="430" y="330" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="590" y="330" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="750" y="330" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <!-- row 2 (one is the event) -->
    <rect class="f-ac" x="270" y="450" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="s-ink" x="430" y="450" width="140" height="100" rx="10" fill="none" stroke-width="5"/>
    <text class="f-ink" x="500" y="512" text-anchor="middle" font-size="26" font-weight="800">$500</text>
    <rect class="f-ac" x="590" y="450" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="750" y="450" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <!-- row 3 -->
    <rect class="f-ac" x="270" y="570" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="430" y="570" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="590" y="570" width="140" height="100" rx="10" fill-opacity="0.85"/>
    <rect class="f-ac" x="750" y="570" width="140" height="100" rx="10" fill-opacity="0.85"/>
  </g>

  <text class="f-ink" x="600" y="800" text-anchor="middle" font-size="34" font-weight="600" fill-opacity="0.7">flat fees + one $500 event</text>
  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="56" font-weight="800">~$5,500 for the year</text>
  <text class="f-ac" x="600" y="970" text-anchor="middle" font-size="30" font-weight="700">broken arm included</text>
</svg>
