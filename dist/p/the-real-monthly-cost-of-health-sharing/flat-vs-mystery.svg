<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <!-- baseline -->
  <line class="s-ink" x1="220" y1="880" x2="980" y2="880" stroke-width="2" stroke-opacity="0.5"/>

  <!-- LEFT: flat fee, cyan, short and clean -->
  <rect class="f-ac" x="330" y="700" width="180" height="180" rx="10"/>
  <text class="f-ink" x="420" y="945" text-anchor="middle" font-size="34" font-weight="800">FLAT FEE</text>
  <text class="f-ink" x="420" y="988" text-anchor="middle" font-size="26" font-weight="500" fill-opacity="0.6">predictable</text>

  <!-- RIGHT: premium + deductible, white, tall, many uneven segments -->
  <g class="s-ink" fill="none" stroke-width="3">
    <rect x="690" y="300" width="180" height="70" rx="6"/>
    <rect x="690" y="378" width="180" height="120" rx="6"/>
    <rect x="690" y="506" width="180" height="55" rx="6"/>
    <rect x="690" y="569" width="180" height="150" rx="6"/>
    <rect x="690" y="727" width="180" height="45" rx="6"/>
    <rect x="690" y="780" width="180" height="100" rx="6"/>
  </g>
  <text class="f-ink" x="780" y="945" text-anchor="middle" font-size="34" font-weight="800">PREMIUM</text>
  <text class="f-ink" x="780" y="988" text-anchor="middle" font-size="34" font-weight="800">+ DEDUCTIBLE</text>
  <text class="f-ink" x="780" y="1031" text-anchor="middle" font-size="26" font-weight="500" fill-opacity="0.6">a stack of surprises</text>
</svg>
