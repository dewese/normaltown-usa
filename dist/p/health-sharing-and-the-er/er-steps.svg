<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="230" text-anchor="middle" font-size="46" font-weight="800">Care first. Bill later.</text>

  <!-- three step circles -->
  <circle class="f-ac" cx="300" cy="560" r="90"/>
  <text class="f-bg" x="300" y="590" text-anchor="middle" font-size="64" font-weight="800">1</text>
  <text class="f-ink" x="300" y="720" text-anchor="middle" font-size="30" font-weight="700">get care</text>

  <circle class="s-ink" cx="600" cy="560" r="90" fill="none" stroke-width="7"/>
  <text class="f-ink" x="600" y="590" text-anchor="middle" font-size="64" font-weight="800">2</text>
  <text class="f-ink" x="600" y="720" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.8">advocate cuts the bill</text>

  <circle class="s-ink" cx="900" cy="560" r="90" fill="none" stroke-width="7"/>
  <text class="f-ink" x="900" y="590" text-anchor="middle" font-size="64" font-weight="800">3</text>
  <text class="f-ink" x="900" y="720" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.8">crowd shares the rest</text>

  <!-- arrows -->
  <g class="s-ac" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="405" y1="560" x2="495" y2="560"/><polyline points="470,540 500,560 470,580"/>
    <line x1="705" y1="560" x2="795" y2="560"/><polyline points="770,540 800,560 770,580"/>
  </g>

  <text class="f-ac" x="600" y="900" text-anchor="middle" font-size="34" font-weight="800">Never do math in the parking lot.</text>
</svg>
