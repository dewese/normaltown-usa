<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="230" text-anchor="middle" font-size="46" font-weight="800" letter-spacing="1">NOT SHARED</text>
  <line class="s-ac" x1="380" y1="270" x2="820" y2="270" stroke-width="4"/>

  <!-- rows with X marks -->
  <g class="f-ink" font-size="40" font-weight="700" fill-opacity="0.75">
    <text x="480" y="410">routine dental &amp; vision</text>
    <text x="480" y="530">cosmetic work</text>
    <text x="480" y="650">costly ongoing meds</text>
    <text x="480" y="770">pre-existing (at first)</text>
  </g>
  <g class="s-ink" stroke-width="9" stroke-opacity="0.5" stroke-linecap="round">
    <line x1="400" y1="380" x2="450" y2="410"/><line x1="450" y1="380" x2="400" y2="410"/>
    <line x1="400" y1="500" x2="450" y2="530"/><line x1="450" y1="500" x2="400" y2="530"/>
    <line x1="400" y1="620" x2="450" y2="650"/><line x1="450" y1="620" x2="400" y2="650"/>
    <line x1="400" y1="740" x2="450" y2="770"/><line x1="450" y1="740" x2="400" y2="770"/>
  </g>

  <text class="f-ac" x="600" y="940" text-anchor="middle" font-size="34" font-weight="800">The gaps are why it's cheap.</text>
</svg>
