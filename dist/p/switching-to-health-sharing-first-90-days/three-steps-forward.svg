<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- connecting line -->
  <line class="s-ink" x1="260" y1="600" x2="940" y2="600" stroke-width="3" stroke-opacity="0.5"/>

  <!-- step 1 -->
  <circle class="s-ink" cx="260" cy="600" r="70" fill="none" stroke-width="4"/>
  <text class="f-ink" x="260" y="613" text-anchor="middle" font-size="46" font-weight="800">1</text>
  <text class="f-ink" x="260" y="740" text-anchor="middle" font-size="30" font-weight="800">SIGN UP</text>
  <text class="f-ink" x="260" y="778" text-anchor="middle" font-size="23" font-weight="500" fill-opacity="0.6">days 1–7</text>

  <!-- step 2 -->
  <circle class="s-ink" cx="600" cy="600" r="70" fill="none" stroke-width="4"/>
  <text class="f-ink" x="600" y="613" text-anchor="middle" font-size="46" font-weight="800">2</text>
  <text class="f-ink" x="600" y="740" text-anchor="middle" font-size="30" font-weight="800">GET SET UP</text>
  <text class="f-ink" x="600" y="778" text-anchor="middle" font-size="23" font-weight="500" fill-opacity="0.6">days 8–30</text>

  <!-- step 3, the point, cyan filled -->
  <circle class="f-ac" cx="940" cy="600" r="70"/>
  <text class="f-bg" x="940" y="614" text-anchor="middle" font-size="46" font-weight="800">3</text>
  <text class="f-ink" x="940" y="740" text-anchor="middle" font-size="30" font-weight="800">SETTLE IN</text>
  <text class="f-ink" x="940" y="778" text-anchor="middle" font-size="23" font-weight="500" fill-opacity="0.6">days 31–90</text>

  <text class="f-ink" x="600" y="360" text-anchor="middle" font-size="30" font-weight="500" fill-opacity="0.6">a calmer setup in three quiet steps</text>
</svg>
