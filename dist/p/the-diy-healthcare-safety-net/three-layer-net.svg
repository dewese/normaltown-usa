<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="200" text-anchor="middle" font-size="46" font-weight="800">Layers, not one magic plan.</text>

  <!-- three stacked bands -->
  <rect class="s-ink" x="300" y="330" width="600" height="150" rx="14" fill="none" stroke-width="6" stroke-opacity="0.6"/>
  <text class="f-ink" x="600" y="425" text-anchor="middle" font-size="38" font-weight="800" fill-opacity="0.85">1. Emergency fund</text>

  <rect class="s-ink" x="300" y="510" width="600" height="150" rx="14" fill="none" stroke-width="6" stroke-opacity="0.6"/>
  <text class="f-ink" x="600" y="605" text-anchor="middle" font-size="38" font-weight="800" fill-opacity="0.85">2. Know the cash price</text>

  <rect class="f-ac" x="300" y="690" width="600" height="150" rx="14"/>
  <text class="f-bg" x="600" y="785" text-anchor="middle" font-size="38" font-weight="800">3. Cover the big stuff</text>

  <text class="f-ink" x="600" y="960" text-anchor="middle" font-size="34" font-weight="600" fill-opacity="0.6">One weak spot won't sink you.</text>
</svg>
