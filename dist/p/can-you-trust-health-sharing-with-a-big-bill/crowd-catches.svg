<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- falling big bill -->
  <circle class="s-ink" cx="600" cy="330" r="120" fill="none" stroke-width="4"/>
  <text class="f-ink" x="600" y="320" text-anchor="middle" font-size="34" font-weight="800">BIG</text>
  <text class="f-ink" x="600" y="362" text-anchor="middle" font-size="34" font-weight="800">BILL</text>
  <!-- motion -->
  <line class="s-ink" x1="600" y1="470" x2="600" y2="560" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 12"/>

  <!-- the crowd: a wide net of connected cyan dots -->
  <g> class="f-ac"
    <circle cx="360" cy="720" r="16"/><circle cx="440" cy="700" r="16"/><circle cx="520" cy="690" r="16"/>
    <circle cx="600" cy="686" r="16"/><circle cx="680" cy="690" r="16"/><circle cx="760" cy="700" r="16"/>
    <circle cx="840" cy="720" r="16"/>
    <circle cx="400" cy="770" r="16"/><circle cx="480" cy="756" r="16"/><circle cx="560" cy="750" r="16"/>
    <circle cx="640" cy="750" r="16"/><circle cx="720" cy="756" r="16"/><circle cx="800" cy="770" r="16"/>
  </g>
  <path class="s-ac" d="M360 720 Q600 640 840 720" fill="none" stroke-width="3" stroke-opacity="0.7"/>
  <path class="s-ac" d="M400 770 Q600 700 800 770" fill="none" stroke-width="3" stroke-opacity="0.7"/>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="40" font-weight="800">THE CROWD CATCHES IT</text>
  <text class="f-ink" x="600" y="952" text-anchor="middle" font-size="27" font-weight="500" fill-opacity="0.6">many give a little, together it covers a lot</text>
</svg>
