<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- 1099 form -->
  <rect class="s-ink" x="220" y="360" width="330" height="420" rx="14" fill="none" stroke-width="6" stroke-opacity="0.7"/>
  <text class="f-ink" x="385" y="500" text-anchor="middle" font-size="90" font-weight="800" fill-opacity="0.8">1099</text>
  <line class="s-ink" x1="270" y1="560" x2="500" y2="560" stroke-width="4" stroke-opacity="0.25"/>
  <line class="s-ink" x1="270" y1="620" x2="500" y2="620" stroke-width="4" stroke-opacity="0.25"/>
  <line class="s-ink" x1="270" y1="680" x2="440" y2="680" stroke-width="4" stroke-opacity="0.25"/>

  <!-- flat line = flat fee -->
  <line class="s-ac" x1="620" y1="570" x2="980" y2="570" stroke-width="14" stroke-linecap="round"/>
  <text class="f-ac" x="800" y="530" text-anchor="middle" font-size="40" font-weight="800">flat $60/mo</text>
  <text class="f-ink" x="800" y="640" text-anchor="middle" font-size="30" font-weight="600" fill-opacity="0.7">not tied to any job</text>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="44" font-weight="800">Coverage that's yours.</text>
</svg>
