<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>
  <line class="s-ink" x1="150" y1="820" x2="1050" y2="820" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 1: list price, tall white -->
  <rect class="s-ink" x="210" y="230" width="150" height="590" rx="8" fill="none" stroke-width="4"/>
  <text class="f-ink" x="285" y="880" text-anchor="middle" font-size="28" font-weight="800">LIST</text>
  <text class="f-ink" x="285" y="914" text-anchor="middle" font-size="28" font-weight="800">PRICE</text>

  <!-- arrow down -->
  <g class="f-ac s-ac" stroke-width="5">
    <line x1="440" y1="520" x2="560" y2="520"/>
    <polygon points="560,500 600,520 560,540"/>
  </g>
  <text class="f-ac" x="520" y="480" text-anchor="middle" font-size="24" font-weight="700">negotiated</text>

  <!-- 2: negotiated, short white -->
  <rect class="s-ink" x="640" y="620" width="150" height="200" rx="8" fill="none" stroke-width="4"/>
  <text class="f-ink" x="715" y="880" text-anchor="middle" font-size="28" font-weight="800">NEGOTIATED</text>

  <!-- arrow to crowd -->
  <g class="f-ac s-ac" stroke-width="5">
    <line x1="820" y1="720" x2="880" y2="720"/>
    <polygon points="880,700 920,720 880,740"/>
  </g>

  <!-- 3: the crowd, small cyan segments -->
  <g> class="f-ac"
    <rect x="945" y="740" width="80" height="22" rx="4"/>
    <rect x="945" y="768" width="80" height="22" rx="4"/>
    <rect x="945" y="796" width="80" height="22" rx="4"/>
    <rect x="945" y="712" width="80" height="22" rx="4"/>
    <rect x="945" y="684" width="80" height="22" rx="4"/>
  </g>
  <text class="f-ink" x="985" y="880" text-anchor="middle" font-size="28" font-weight="800">THE CROWD</text>

  <text class="f-ink" x="600" y="990" text-anchor="middle" font-size="27" font-weight="500" fill-opacity="0.6">shrink the bill first, then share what's left</text>
</svg>
