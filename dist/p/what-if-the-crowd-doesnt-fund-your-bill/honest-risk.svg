<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- falling bill -->
  <rect class="s-ink" x="520" y="200" width="160" height="200" rx="10" fill="none" stroke-width="6" stroke-opacity="0.7"/>
  <text class="f-ink" x="600" y="320" text-anchor="middle" font-size="34" font-weight="800" fill-opacity="0.7">BILL</text>

  <!-- net: cyan mesh with a gap on the right -->
  <g class="s-ac" stroke-width="6" fill="none">
    <path d="M180 640 Q600 820 940 660"/>
    <line x1="240" y1="662" x2="300" y2="760"/>
    <line x1="330" y1="690" x2="390" y2="800"/>
    <line x1="430" y1="712" x2="490" y2="822"/>
    <line x1="540" y1="726" x2="600" y2="828"/>
    <line x1="650" y1="722" x2="700" y2="820"/>
    <line x1="760" y1="706" x2="800" y2="795"/>
    <path d="M240 760 Q600 900 800 796" />
    <path d="M300 700 Q600 850 860 700" stroke-opacity="0.6"/>
  </g>
  <!-- honest gap marker -->
  <text class="f-ink" x="990" y="660" font-size="26" font-weight="600" fill-opacity="0.45">no legal</text>
  <text class="f-ink" x="990" y="694" font-size="26" font-weight="600" fill-opacity="0.45">guarantee</text>

  <text class="f-ink" x="600" y="1010" text-anchor="middle" font-size="44" font-weight="800">Strong net. Honest gap.</text>
</svg>
