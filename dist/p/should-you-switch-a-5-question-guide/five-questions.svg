<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="240" text-anchor="middle" font-size="46" font-weight="800">Five honest questions.</text>

  <!-- five numbered circles, staggered down like steps -->
  <g>
    <circle class="f-ac" cx="250" cy="430" r="70"/><text class="f-bg" x="250" y="455" text-anchor="middle" font-size="52" font-weight="800">1</text>
    <circle class="f-ac" cx="425" cy="500" r="70" fill-opacity="0.9"/><text class="f-bg" x="425" y="525" text-anchor="middle" font-size="52" font-weight="800">2</text>
    <circle class="f-ac" cx="600" cy="570" r="70" fill-opacity="0.8"/><text class="f-bg" x="600" y="595" text-anchor="middle" font-size="52" font-weight="800">3</text>
    <circle class="f-ac" cx="775" cy="640" r="70" fill-opacity="0.7"/><text class="f-bg" x="775" y="665" text-anchor="middle" font-size="52" font-weight="800">4</text>
    <circle class="f-ac" cx="950" cy="710" r="70" fill-opacity="0.6"/><text class="f-bg" x="950" y="735" text-anchor="middle" font-size="52" font-weight="800">5</text>
  </g>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="40" font-weight="800">Mostly yes? Take a look.</text>
  <text class="f-ink" x="600" y="970" text-anchor="middle" font-size="30" font-weight="600" fill-opacity="0.6">Decide with your eyes open.</text>
</svg>
