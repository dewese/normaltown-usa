<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- badge / seal -->
  <g transform="translate(600,500)">
    <path class="s-ink" d="M0,-250 L60,-215 130,-215 145,-140 200,-90 165,-25 165,45 100,80 60,145 0,120 -60,145 -100,80 -165,45 -165,-25 -200,-90 -145,-140 -130,-215 -60,-215 Z"
          fill="none" stroke-width="6" stroke-opacity="0.4"/>
    <circle class="s-ac" r="150" fill="none" stroke-width="8"/>
    <polyline class="s-ac" points="-70,10 -20,60 80,-60" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="f-ink" x="600" y="850" text-anchor="middle" font-size="46" font-weight="800">Real, and honest about it.</text>
  <text class="f-ink" x="600" y="920" text-anchor="middle" font-size="32" font-weight="600" fill-opacity="0.6">legit, but not insurance</text>
</svg>
