<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="180" text-anchor="middle" font-size="42" font-weight="800">Same MRI. Two prices.</text>

  <!-- insured price tag (tall/faint) -->
  <g class="s-ink" stroke-width="6" stroke-opacity="0.5" fill="none">
    <path d="M300 320 h200 v300 h-200 z"/>
  </g>
  <circle class="f-ink" cx="470" cy="355" r="12" fill-opacity="0.5"/>
  <text class="f-ink" x="400" y="500" text-anchor="middle" font-size="46" font-weight="800" fill-opacity="0.5">$2,400</text>
  <text class="f-ink" x="400" y="700" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.5">insured price</text>

  <!-- cash price tag (cyan, bold) -->
  <g class="s-ac" stroke-width="8" fill="none">
    <path d="M700 320 h200 v300 h-200 z"/>
  </g>
  <circle class="f-ac" cx="870" cy="355" r="12"/>
  <text class="f-ac" x="800" y="500" text-anchor="middle" font-size="54" font-weight="800">$600</text>
  <text class="f-ink" x="800" y="700" text-anchor="middle" font-size="30" font-weight="800">cash price</text>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="40" font-weight="800">Just ask for it.</text>
</svg>
