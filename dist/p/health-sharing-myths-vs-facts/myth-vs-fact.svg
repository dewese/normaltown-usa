<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- divider -->
  <line class="s-ink" x1="600" y1="300" x2="600" y2="900" stroke-width="2" stroke-opacity="0.25"/>

  <!-- LEFT: myth, faint white X -->
  <g class="s-ink" stroke-width="10" stroke-opacity="0.45" stroke-linecap="round">
    <line x1="300" y1="500" x2="420" y2="620"/>
    <line x1="420" y1="500" x2="300" y2="620"/>
  </g>
  <text class="f-ink" x="360" y="760" text-anchor="middle" font-size="40" font-weight="800" fill-opacity="0.55">MYTH</text>
  <text class="f-ink" x="360" y="806" text-anchor="middle" font-size="24" font-weight="500" fill-opacity="0.4">leftover confusion</text>

  <!-- RIGHT: fact, bold cyan check -->
  <g class="s-ac" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="770,570 830,630 940,500"/>
  </g>
  <text class="f-ink" x="855" y="760" text-anchor="middle" font-size="40" font-weight="800">FACT</text>
  <text class="f-ink" x="855" y="806" text-anchor="middle" font-size="24" font-weight="500" fill-opacity="0.6">what holds up</text>
</svg>
