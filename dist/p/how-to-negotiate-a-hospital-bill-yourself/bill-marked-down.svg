<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- bill -->
  <rect class="s-ink" x="360" y="230" width="480" height="620" rx="16" fill="none" stroke-width="6" stroke-opacity="0.7"/>
  <text class="f-ink" x="600" y="330" text-anchor="middle" font-size="34" font-weight="700" fill-opacity="0.6" letter-spacing="3">HOSPITAL BILL</text>
  <line class="s-ink" x1="420" y1="380" x2="780" y2="380" stroke-width="4" stroke-opacity="0.25"/>
  <line class="s-ink" x1="420" y1="440" x2="700" y2="440" stroke-width="4" stroke-opacity="0.25"/>
  <line class="s-ink" x1="420" y1="500" x2="740" y2="500" stroke-width="4" stroke-opacity="0.25"/>

  <!-- sticker price crossed out -->
  <text class="f-ink" x="600" y="640" text-anchor="middle" font-size="72" font-weight="800" fill-opacity="0.4">$12,400</text>
  <line class="s-ink" x1="410" y1="618" x2="790" y2="618" stroke-width="8" stroke-opacity="0.7"/>

  <!-- cash price -->
  <text class="f-ac" x="600" y="760" text-anchor="middle" font-size="86" font-weight="800">$3,900</text>

  <text class="f-ink" x="600" y="960" text-anchor="middle" font-size="46" font-weight="800">Ask for the cash price.</text>
</svg>
