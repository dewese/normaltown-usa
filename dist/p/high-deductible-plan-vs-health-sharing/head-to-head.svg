<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="170" text-anchor="middle" font-size="44" font-weight="800">Same bet, better shape.</text>

  <!-- divider -->
  <line class="s-ink" x1="600" y1="250" x2="600" y2="1010" stroke-width="2" stroke-opacity="0.2"/>

  <!-- LEFT: high-deductible plan -->
  <text class="f-ink" x="340" y="330" text-anchor="middle" font-size="32" font-weight="800" fill-opacity="0.55">HIGH-DEDUCTIBLE PLAN</text>
  <text class="f-ink" x="340" y="470" text-anchor="middle" font-size="30" font-weight="600" fill-opacity="0.5">high monthly bill</text>
  <text class="f-ink" x="340" y="560" text-anchor="middle" font-size="30" font-weight="600" fill-opacity="0.5">five-figure wall</text>
  <text class="f-ink" x="340" y="650" text-anchor="middle" font-size="30" font-weight="600" fill-opacity="0.5">then it helps</text>
  <text class="f-ac" x="340" y="800" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.8">+ legal guarantee</text>

  <!-- RIGHT: health sharing -->
  <text class="f-ac" x="860" y="330" text-anchor="middle" font-size="32" font-weight="800">HEALTH SHARING</text>
  <text class="f-ink" x="860" y="470" text-anchor="middle" font-size="30" font-weight="700">flat $60/mo</text>
  <text class="f-ink" x="860" y="560" text-anchor="middle" font-size="30" font-weight="700">$500 per event</text>
  <text class="f-ink" x="860" y="650" text-anchor="middle" font-size="30" font-weight="700">crowd funds the rest</text>
  <text class="f-ink" x="860" y="800" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.55">no legal guarantee</text>
</svg>
