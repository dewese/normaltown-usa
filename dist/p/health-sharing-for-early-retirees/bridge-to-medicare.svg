<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="230" text-anchor="middle" font-size="44" font-weight="800">Bridging the gap to 65.</text>

  <!-- two posts -->
  <line class="s-ink" x1="230" y1="560" x2="230" y2="820" stroke-width="10" stroke-opacity="0.6"/>
  <line class="s-ink" x1="970" y1="560" x2="970" y2="820" stroke-width="10" stroke-opacity="0.6"/>

  <!-- bridge span (cyan) -->
  <path class="s-ac" d="M230 560 Q600 430 970 560" fill="none" stroke-width="14" stroke-linecap="round"/>
  <!-- suspenders -->
  <g class="s-ac" stroke-width="5" stroke-opacity="0.7">
    <line x1="360" y1="512" x2="360" y2="560"/>
    <line x1="490" y1="478" x2="490" y2="560"/>
    <line x1="600" y1="466" x2="600" y2="560"/>
    <line x1="710" y1="478" x2="710" y2="560"/>
    <line x1="840" y1="512" x2="840" y2="560"/>
  </g>

  <text class="f-ink" x="230" y="880" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.75">retire at 60</text>
  <text class="f-ink" x="970" y="880" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.75">Medicare at 65</text>

  <text class="f-ac" x="600" y="1000" text-anchor="middle" font-size="36" font-weight="800">Flat price, whatever your age.</text>
</svg>
