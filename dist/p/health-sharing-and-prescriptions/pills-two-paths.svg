<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- capsule -->
  <g transform="translate(600,340) rotate(45)">
    <rect class="s-ac" x="-150" y="-55" width="300" height="110" rx="55" fill="none" stroke-width="12"/>
    <line class="s-ac" x1="0" y1="-55" x2="0" y2="55" stroke-width="12"/>
  </g>

  <!-- two branching arrows -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- cheap generics (cyan) -->
    <path class="s-ac" d="M540 470 C 460 600, 380 640, 320 700" stroke-width="10"/>
    <polyline class="s-ac" points="345,660 320,705 365,712" stroke-width="10"/>
    <!-- costly ongoing (faint) -->
    <path class="s-ink" d="M660 470 C 740 600, 820 640, 880 700" stroke-width="10" stroke-opacity="0.4"/>
    <polyline class="s-ink" points="855,660 880,705 835,712" stroke-width="10" stroke-opacity="0.4"/>
  </g>

  <text class="f-ac" x="320" y="800" text-anchor="middle" font-size="34" font-weight="800">cheap generics</text>
  <text class="f-ink" x="320" y="846" text-anchor="middle" font-size="26" font-weight="500" fill-opacity="0.7">pay the cash price</text>

  <text class="f-ink" x="880" y="800" text-anchor="middle" font-size="34" font-weight="800" fill-opacity="0.55">costly ongoing meds</text>
  <text class="f-ink" x="880" y="846" text-anchor="middle" font-size="26" font-weight="500" fill-opacity="0.4">the real limit</text>

  <text class="f-ink" x="600" y="1000" text-anchor="middle" font-size="42" font-weight="800">Know which camp you're in.</text>
</svg>
