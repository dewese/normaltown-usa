<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- baseline -->
  <line class="s-ink" x1="200" y1="860" x2="1000" y2="860" stroke-width="3" stroke-opacity="0.25"/>

  <!-- small $500 block -->
  <rect class="f-ac" x="290" y="790" width="220" height="70"/>
  <text class="f-ac" x="400" y="750" text-anchor="middle" font-size="52" font-weight="800">$500</text>
  <text class="f-ink" x="400" y="920" text-anchor="middle" font-size="30" font-weight="700">per event</text>

  <!-- tall deductible bar -->
  <rect class="s-ink" x="690" y="300" width="220" height="560" fill="none" stroke-width="6" stroke-opacity="0.7"/>
  <text class="f-ink" x="800" y="260" text-anchor="middle" font-size="52" font-weight="800">$8,000</text>
  <text class="f-ink" x="800" y="920" text-anchor="middle" font-size="30" font-weight="700" fill-opacity="0.7">deductible, every year</text>

  <text class="f-ink" x="600" y="1050" text-anchor="middle" font-size="44" font-weight="800">A step, not a wall.</text>
</svg>
