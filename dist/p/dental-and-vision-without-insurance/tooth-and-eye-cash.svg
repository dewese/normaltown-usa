<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="230" text-anchor="middle" font-size="44" font-weight="800">The easy part to pay for.</text>

  <!-- tooth -->
  <path class="s-ac" d="M360 430 C 360 380, 480 380, 480 430 C 480 520, 460 620, 440 630 C 425 638, 425 560, 420 560 C 415 560, 415 638, 400 630 C 380 620, 360 520, 360 430 Z"
        fill="none" stroke-width="10" stroke-linejoin="round"/>
  <text class="f-ink" x="420" y="720" text-anchor="middle" font-size="30" font-weight="700">dental</text>

  <!-- eye -->
  <path class="s-ac" d="M720 520 Q800 450 880 520 Q800 590 720 520 Z" fill="none" stroke-width="10"/>
  <circle class="s-ac" cx="800" cy="520" r="30" fill="none" stroke-width="10"/>
  <circle class="f-ac" cx="800" cy="520" r="8"/>
  <text class="f-ink" x="800" y="720" text-anchor="middle" font-size="30" font-weight="700">vision</text>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="40" font-weight="800">Predictable. So budget it.</text>
</svg>
