<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- central bill -->
  <rect class="s-ink" x="480" y="470" width="240" height="260" rx="14" fill="none" stroke-width="7"/>
  <text class="f-ink" x="600" y="590" text-anchor="middle" font-size="34" font-weight="800">ONE</text>
  <text class="f-ink" x="600" y="640" text-anchor="middle" font-size="34" font-weight="800">BILL</text>

  <!-- ring of small cyan checks (many members) -->
  <g class="s-ac" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="230,250 255,278 300,225"/>
    <polyline points="580,180 605,208 650,155"/>
    <polyline points="930,250 955,278 1000,225"/>
    <polyline points="180,570 205,598 250,545"/>
    <polyline points="960,570 985,598 1030,545"/>
    <polyline points="240,900 265,928 310,875"/>
    <polyline points="580,980 605,1008 650,955"/>
    <polyline points="930,900 955,928 1000,875"/>
    <polyline points="410,300 435,328 480,275" stroke-opacity="0.6"/>
    <polyline points="760,300 785,328 830,275" stroke-opacity="0.6"/>
    <polyline points="410,850 435,878 480,825" stroke-opacity="0.6"/>
    <polyline points="760,850 785,878 830,825" stroke-opacity="0.6"/>
  </g>

  <text class="f-ink" x="600" y="1120" text-anchor="middle" font-size="40" font-weight="800">Many members, one bill.</text>
</svg>
