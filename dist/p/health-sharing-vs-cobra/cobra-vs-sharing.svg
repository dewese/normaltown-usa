<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <text class="f-ink" x="600" y="180" text-anchor="middle" font-size="44" font-weight="800">Same coverage, very different bill.</text>

  <!-- baseline -->
  <line class="s-ink" x1="200" y1="880" x2="1000" y2="880" stroke-width="3" stroke-opacity="0.25"/>

  <!-- COBRA tall bar -->
  <rect class="s-ink" x="290" y="320" width="220" height="560" fill="none" stroke-width="6" stroke-opacity="0.6"/>
  <text class="f-ink" x="400" y="280" text-anchor="middle" font-size="46" font-weight="800" fill-opacity="0.7">$1,600/mo</text>
  <text class="f-ink" x="400" y="940" text-anchor="middle" font-size="32" font-weight="700" fill-opacity="0.7">COBRA</text>

  <!-- health sharing short bar -->
  <rect class="f-ac" x="690" y="790" width="220" height="90"/>
  <text class="f-ac" x="800" y="750" text-anchor="middle" font-size="46" font-weight="800">~$300/mo</text>
  <text class="f-ink" x="800" y="940" text-anchor="middle" font-size="32" font-weight="800">health sharing</text>

  <text class="f-ink" x="600" y="1060" text-anchor="middle" font-size="34" font-weight="700" fill-opacity="0.6">If you're healthy, bridge cheaper.</text>
</svg>
