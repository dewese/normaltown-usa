<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
<style id="normaltown-theme">.f-bg{fill:#F3EDE4}.s-bg{stroke:#F3EDE4}.f-ink{fill:#1B1917}.s-ink{stroke:#1B1917}.f-ac{fill:#0E6F63}.s-ac{stroke:#0E6F63}@media (prefers-color-scheme:dark){.f-bg{fill:#141210}.s-bg{stroke:#141210}.f-ink{fill:#F7F3EC}.s-ink{stroke:#F7F3EC}.f-ac{fill:#4FC7B4}.s-ac{stroke:#4FC7B4}}</style>
  <rect class="f-bg" width="1200" height="1200"/>

  <!-- person icon (the advocate) -->
  <circle class="s-ac" cx="360" cy="470" r="70" fill="none" stroke-width="14"/>
  <path class="s-ac" d="M250 700 a110 110 0 0 1 220 0" fill="none" stroke-width="14" stroke-linecap="round"/>
  <text class="f-ink" x="360" y="770" text-anchor="middle" font-size="30" font-weight="700">your advocate</text>

  <!-- bill with shrinking total -->
  <rect class="s-ink" x="640" y="360" width="300" height="380" rx="12" fill="none" stroke-width="6" stroke-opacity="0.7"/>
  <line class="s-ink" x1="690" y1="430" x2="890" y2="430" stroke-width="6" stroke-opacity="0.35"/>
  <line class="s-ink" x1="690" y1="480" x2="890" y2="480" stroke-width="6" stroke-opacity="0.35"/>
  <text class="f-ink" x="790" y="600" text-anchor="middle" font-size="52" font-weight="800" fill-opacity="0.4" text-decoration="line-through">$9,000</text>
  <text class="f-ac" x="790" y="690" text-anchor="middle" font-size="60" font-weight="800">$1,400</text>

  <!-- arrow from advocate to bill -->
  <g class="s-ac" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="470" y1="540" x2="620" y2="540"/>
    <polyline points="580,510 620,540 580,570"/>
  </g>

  <text class="f-ink" x="600" y="900" text-anchor="middle" font-size="46" font-weight="800">A real person, in your corner.</text>
</svg>
